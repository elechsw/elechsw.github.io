 const u=(a,b)=>{E.push([a,b]);P[f(a)]=f(b)};ws.forEach(w=>{P[f(w[0])]=f(w[1])});
 if(!s.pb0)u('p0a','p0b');if(!s.ol)u('oa','ob');if(s.pb1)u('p1a','p1b');if(mc)u('c13','c14');else u('c21','c22');
 const short=s.qf&&f('L')===f('N');
 const on=(a,b)=>s.qf&&!short&&((f(a)===f('L')&&f(b)===f('N'))||(f(a)===f('N')&&f(b)===f('L')));
 return{f,E,short,mc:on('A1','A2'),g:on('g1','g2'),r:on('r1','r2')}}
function bfs(src,E){const A={},d={};E.forEach(e=>{(A[e[0]]=A[e[0]]||[]).push(e[1]);(A[e[1]]=A[e[1]]||[]).push(e[0])});
 src.forEach(s=>d[s]=0);const q=[...src];while(q.length){const x=q.shift();(A[x]||[]).forEach(y=>{if(d[y]==null){d[y]=d[x]+1;q.push(y)}})}return d}
/* ---- 배선 ---- */
const W=[],PAL=['#ff0000','#ffe600','#00d63a','#0066ff','#ff7a00','#ff00aa','#00c8ff','#8a00ff','#00ffa0','#ffffff'];
const dotG=new THREE.SphereGeometry(.04,10,10);
function addWire(a,b){if(a===b||W.some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)))return false;
 const pa=T[a].p,pb=T[b].p,mid=pa.clone().add(pb).multiplyScalar(.5);mid.z+=.1+.045*(W.length%6);mid.y-=.05;
 const cv=new THREE.CatmullRomCurve3([pa,pa.clone().add(new THREE.Vector3(0,0,.06)),mid,pb.clone().add(new THREE.Vector3(0,0,.06)),pb]);
 const col=new THREE.Color(PAL[W.length%PAL.length]);
 const mat=new THREE.MeshStandardMaterial({color:col,roughness:.4,metalness:0,emissive:col,emissiveIntensity:.35,toneMapped:false});
 const mesh=new THREE.Mesh(new THREE.TubeGeometry(cv,28,.03,8),mat);S.add(mesh);
 const dots=[0,1,2,3,4].map(()=>{const d=new THREE.Mesh(dotG,new THREE.MeshBasicMaterial({color:0xffd23f}));d.visible=false;S.add(d);return d});
 W.push({a,b,cv,mesh,dots,dir:0,kind:0});return true}
function delWire(w){S.remove(w.mesh);w.dots.forEach(d=>S.remove(d));W.splice(W.indexOf(w),1)}
const ANS=[['L','p0a'],['p0b','oa'],['ob','p1a'],['ob','c13'],['p1b','A1'],['c14','A1'],['A2','N'],['A1','g1'],['g2','N'],['L','c21'],['c22','r1'],['r2','N']];
/* ---- 상태 갱신 ---- */
let note='';
function msg(t,c){$('msg').innerHTML=t;$('msg').style.color=c||'#9eb1ca'}
function refresh(){const ws=W.map(w=>[w.a,w.b]);let m=st.mc;
 for(let i=0;i<5;i++)m=calc(st,m,ws).mc;st.mc=m;let r=calc(st,m,ws);
 if(r.short){st.qf=false;st.mc=false;$('qf').checked=false;msg('⚠ 단락! L과 N이 접점으로 직결되어 QF가 차단되었습니다. 배선을 확인하세요.','#ff8a8a');r=calc(st,false,ws)}
 const loads=[['A1','A2',r.mc],['g1','g2',r.g],['r1','r2',r.r]].filter(l=>l[2]),Ls=[],Ns=[];
 loads.forEach(l=>{if(r.f(l[0])===r.f('L')){Ls.push(l[0]);Ns.push(l[1])}else{Ls.push(l[1]);Ns.push(l[0])}});
 const d1=bfs(['L'],r.E),d2=bfs(Ls,r.E),d3=bfs(['N'],r.E),d4=bfs(Ns,r.E);
 W.forEach(w=>{w.dir=0;if(!loads.length)return;
  [[w.a,w.b,1],[w.b,w.a,-1]].forEach(([x,y,s])=>{
   if(d1[x]!=null&&d1[y]===d1[x]+1&&d2[y]===d2[x]-1){w.dir=s;w.kind=0}
   else if(d3[x]!=null&&d3[y]===d3[x]-1&&d4[y]===d4[x]+1){w.dir=s;w.kind=1}})});
 W.forEach(w=>w.dots.forEach(d=>d.material.color.set(w.kind?0x55e0ff:0xffd23f)));
 st.g=r.g;st.r=r.r;
 $('stt').innerHTML=`QF: <b>${st.qf?'ON':'OFF'}</b> · MC: <b style="color:${st.mc?'#4ade80':'#aab'}">${st.mc?'여자(자기유지)':'소자'}</b><br>운전등(녹) ${r.g?'🟢 점등':'⚫ 소등'} · 정지등(적) ${r.r?'🔴 점등':'⚫ 소등'}${st.ol?'<br><span style="color:#ffb86b">OL 트립: 95-96 개방</span>':''}`}
function setQF(v){st.qf=v;$('qf').checked=v;lever.rotation.z=v?-.5:.5;refresh()}
function setOL(v){st.ol=v;$('ol').checked=v;refresh()}
$('qf').onchange=e=>setQF(e.target.checked);$('ol').onchange=e=>setOL(e.target.checked);
function hold(id,k){const b=$(id);b.onpointerdown=()=>{st[k]=1;refresh()};b.onpointerup=b.onpointerleave=()=>{if(st[k]){st[k]=0;refresh()}}}
hold('b1','pb1');hold('b0','pb0');
addEventListener('pointerup',()=>{if(st.pb0||st.pb1){st.pb0=st.pb1=0;refresh()}});
$('und').onclick=()=>{if(W.length)delWire(W[W.length-1]);sel(null);refresh()};
$('clr').onclick=()=>{while(W.length)delWire(W[0]);sel(null);refresh();msg('배선을 모두 지웠습니다. 단자를 차례로 클릭해 다시 연결하세요.')};
$('ans').onclick=()=>{while(W.length)delWire(W[0]);ANS.forEach(p=>addWire(p[0],p[1]));refresh();msg('정답 배선입니다.<br>L→PB0(1-2)→OL(95-96)→[PB1(3-4) ∥ MC 13-14]→A1, A2→N<br>운전등: A1→G1, G2→N / 정지등: L→21-22→R1, R2→N')};
$('chk').onclick=()=>{const ws=W.map(w=>[w.a,w.b]);let m=false;
 const o=(p0,p1)=>{let r;for(let i=0;i<5;i++){r=calc({qf:true,pb0:p0,pb1:p1,ol:false},m,ws);m=r.mc}return r};
 const r1=o(0,0),r2=o(0,1),r3=o(0,0),r4=o(1,0);
 if([r1,r2,r3,r4].some(r=>r.short))return msg('⚠ 단락 배선이 있습니다. L과 N이 직결되는 경로를 확인하세요.','#ff8a8a');
 const ck=[[!r1.mc&&r1.r&&!r1.g,'대기: MC 소자, 정지등 점등'],[r2.mc&&r2.g&&!r2.r,'START 누름: MC 여자, 운전등 점등'],[r3.mc&&r3.g,'START 놓음: 자기유지로 MC 유지'],[!r4.mc&&r4.r&&!r4.g,'STOP 누름: MC 소자, 정지등 점등']];
 const bad=ck.filter(c=>!c[0]);
 bad.length?msg('✖ 미완성:<br>'+bad.map(c=>'· '+c[1]).join('<br>'),'#ffb86b'):msg('✔ 자기유지 회로가 정상 동작합니다! QF를 켜고 START/STOP을 눌러 보세요.','#4ade80')};
/* ---- 조명 ---- */
let flick=1.4;function setBright(v){const k=v/100;tubeM.emissiveIntensity=2*k;glowM.opacity=.15+.45*k;PL.forEach(l=>l.intensity=1.4*k*l.userData.m);amb.intensity=.02+.06*k}
$('br').oninput=e=>{setBright(e.target.value);flick=0};
/* ---- 카메라/입력 ---- */
const cam={yaw:0,pit:.1,dist:6.6,tx:0,ty:1.8,tz:-3.8},g={...cam};
$('v1').onclick=()=>Object.assign(g,{yaw:0,pit:.1,dist:6.6,ty:1.8});
$('v2').onclick=()=>Object.assign(g,{yaw:0,pit:.05,dist:3.7,ty:1.95});
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;
 const open=$('ui').style.display!=='none',off=(open&&innerWidth>700)?($('ui').offsetWidth+20)/2:0;
 if(off)C.setViewOffset(innerWidth,innerHeight,-off,0,innerWidth,innerHeight);else C.clearViewOffset();C.updateProjectionMatrix()}
$('tg').onclick=()=>{const u=$('ui');u.style.display=u.style.display==='none'?'block':'none';$('tg').textContent=u.style.display==='none'?'조작판 ▶':'조작판 ◀';resize()};
addEventListener('resize',resize);
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let selT=null,drag=null,downObj=null,hov=null;
function pick(e){const r=R.domElement.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,C);const h=ray.intersectObjects(IX,false)[0];return h&&h.object}
function sel(id){if(selT){T[selT].m.material.emissive.set(0x553a00);T[selT].m.scale.setScalar(1)}selT=id;if(id){T[id].m.material.emissive.set(0xff8800);T[id].m.scale.setScalar(1.4)}}
R.domElement.addEventListener('pointerdown',e=>{const o=pick(e);downObj=o;
 if(o&&o.userData.pb){st[o.userData.pb]=1;refresh()}else if(!o)drag={x:e.clientX,y:e.clientY}});
R.domElement.addEventListener('pointermove',e=>{if(drag){g.yaw=Math.max(-1.2,Math.min(1.2,g.yaw-(e.clientX-drag.x)*.005));g.pit=Math.max(-.1,Math.min(.8,g.pit+(e.clientY-drag.y)*.004));drag={x:e.clientX,y:e.clientY};return}
 const o=pick(e);R.domElement.style.cursor=o?'pointer':'grab';
 if(o!==hov){if(hov&&hov.userData.hl)hov.material.emissiveIntensity=hov.userData.hl;hov=o;if(o&&o.userData.door)o.material.emissiveIntensity=.9}});
addEventListener('pointerup',e=>{drag=null;const o=downObj;downObj=null;if(!o)return;
 if(o.userData.term){const id=o.userData.term;if(!selT)sel(id);else if(selT===id)sel(null);else{const a=selT;sel(null);if(addWire(a,id)){refresh();msg(`배선: ${a} ↔ ${id} (${W.length}개)`)}}}
 else if(o.userData.act)o.userData.act()});
R.domElement.addEventListener('wheel',e=>{g.dist=Math.max(2.5,Math.min(9,g.dist+e.deltaY*.004));e.preventDefault()},{passive:false});
/* ---- 애니메이션 ---- */
const clk=new THREE.Clock();let tm=0;
function loop(){requestAnimationFrame(loop);const dt=clk.getDelta();tm+=dt;
 if(flick<1.3){flick+=dt;const k=$('br').value/100,on=flick>1?1:(Math.random()>.45?1:.15);tubeM.emissiveIntensity=2*k*on;glowM.opacity=(.15+.45*k)*on;PL.forEach(l=>l.intensity=1.4*k*on*l.userData.m)}
 else if(flick<2){flick=2;setBright($('br').value)}
 for(const k of ['yaw','pit','dist','ty'])cam[k]+=(g[k]-cam[k])*.1;
 C.position.set(cam.tx+cam.dist*Math.sin(cam.yaw)*Math.cos(cam.pit),cam.ty+cam.dist*Math.sin(cam.pit),cam.tz+cam.dist*Math.cos(cam.yaw)*Math.cos(cam.pit));C.lookAt(cam.tx,cam.ty,cam.tz);
 cap0.position.z=st.pb0?-3.75:-3.7;cap1.position.z=st.pb1?-3.75:-3.7;olb.position.z=st.ol?-3.73:-3.7;
 plg.position.y=1.5+(st.mc?.1:0);plg.material.emissive.set(st.mc?0x884400:0);
 const gl=st.qf&&st.g,rl=st.qf&&st.r;lensG.emissive.set(gl?0x33ff88:0);lensG.emissiveIntensity=gl?1.4:0;lensR.emissive.set(rl?0xff3333:0);lensR.emissiveIntensity=rl?1.4:0;
 lG.intensity=gl?1:0;lR.intensity=rl?1:0;
 W.forEach(w=>{const on=w.dir!==0;w.mesh.material.emissiveIntensity=on?.7:.35;
  w.dots.forEach((d,i)=>{d.visible=on;if(on){const t=((tm*.55+i/5)%1);d.position.copy(w.cv.getPoint(w.dir>0?t:1-t))}})});
 R.render(S,C)}
setBright(85);flick=0;setQF(false);refresh();resize();
msg('① 금색 단자 두 개를 차례로 클릭해 배선 → ② <b>회로 점검</b> → ③ QF ON 후 START/STOP 캡을 눌러보세요. 막히면 <b>정답 배선</b>을 눌러 비교하세요.<br>양쪽 <b>문</b>을 클릭하면 다른 실습실로 이동합니다.');
loop();
</script></body></html>
